<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X: FINAL VERSION</title>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Arial Black', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-wrapper { position: relative; border: 5px solid #00aaff; box-shadow: 0 0 40px #00aaff; }
        canvas { background: #000; display: block; }
        
        /* Interface de Usuário */
        #ui { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 5; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 10px 20px; border: 1px solid #00aaff; border-radius: 5px; }
        #hp-container { width: 150px; height: 15px; background: #333; border: 1px solid #fff; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: #ff3333; transition: 0.2s; }
        
        /* Menu de Início e Fim */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
        h1 { font-size: 80px; color: #00aaff; margin: 0; text-shadow: 0 0 20px #00aaff; }
        .btn { padding: 15px 45px; font-size: 22px; background: #00aaff; color: white; border: none; cursor: pointer; border-radius: 50px; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #ffd700; color: #000; transform: scale(1.1); box-shadow: 0 0 20px #ffd700; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui">
        <div class="stat-box">
            VITALIDADE
            <div id="hp-container"><div id="hp-fill"></div></div>
        </div>
        <div class="stat-box">ABATES: <span id="score">0</span> / 30</div>
    </div>

    <div id="overlay">
        <h1 id="title">NINJA-X</h1>
        <p id="desc">Sobreviva aos Samurais e desperte o poder dourado.</p>
        <p style="color: #666;">Use WASD para mover e ESPAÇO para atacar</p>
        <button class="btn" onclick="initGame()">INICIAR COMBATE</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 900; canvas.height = 600;

// Estados do Jogo
let running = false;
let score = 0;
let hp = 100;
let isGlowUp = false;
let bossMode = false;

// Objetos
const ninja = { x: 450, y: 300, size: 35, speed: 5, color: '#00aaff', attacking: false };
const boss = { x: 1000, y: 300, size: 110, hp: 100, active: false };
let enemies = [];
let particles = [];
let keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function initGame() {
    document.getElementById('overlay').style.display = 'none';
    running = true;
    score = 0; hp = 100; enemies = []; particles = [];
    document.getElementById('hp-fill').style.width = '100%';
    document.getElementById('score').innerText = '0';
    spawnSamurai();
    requestAnimationFrame(gameLoop);
}

function spawnSamurai() {
    if (!running || bossMode) return;
    // Surge sempre fora da tela de forma aleatória
    let x, y;
    if (Math.random() > 0.5) {
        x = Math.random() > 0.5 ? -50 : canvas.width + 50;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() > 0.5 ? -50 : canvas.height + 50;
    }
    enemies.push({ x, y, size: 28, speed: 2 });
    // Spawn fica mais rápido com o tempo
    let nextSpawn = isGlowUp ? 400 : 900;
    setTimeout(spawnSamurai, nextSpawn);
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x, y, 
            vx: (Math.random() - 0.5) * 8, 
            vy: (Math.random() - 0.5) * 8, 
            life: 20, color
        });
    }
}

function gameLoop() {
    if (!running) return;

    // 1. LIMPAR TELA
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)"; // Efeito de rastro leve
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. MOVIMENTO NINJA
    if (keys['KeyW']) ninja.y -= ninja.speed;
    if (keys['KeyS']) ninja.y += ninja.speed;
    if (keys['KeyA']) ninja.x -= ninja.speed;
    if (keys['KeyD']) ninja.x += ninja.speed;

    // Limites de tela
    ninja.x = Math.max(20, Math.min(canvas.width - 20, ninja.x));
    ninja.y = Math.max(20, Math.min(canvas.height - 20, ninja.y));

    // 3. ATAQUE
    if (keys['Space'] && !ninja.attacking) {
        ninja.attacking = true;
        setTimeout(() => ninja.attacking = false, 200);
    }

    // 4. VERIFICAR GLOW UP
    if (score >= 30 && !isGlowUp) {
        isGlowUp = true;
        ninja.color = '#ffd700';
        ninja.speed = 9;
        ninja.size = 55;
        bossMode = true;
        boss.active = true;
    }

    // 5. PROCESSAR INIMIGOS
    enemies.forEach((en, index) => {
        const dx = ninja.x - en.x;
        const dy = ninja.y - en.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        en.x += (dx/dist) * en.speed;
        en.y += (dy/dist) * en.speed;

        // Desenhar Samurai (Vermelho Neon)
        ctx.shadowBlur = 10; ctx.shadowColor = "red";
        ctx.fillStyle = "#ff2222";
        ctx.fillRect(en.x - en.size/2, en.y - en.size/2, en.size, en.size);

        // Colisão Dano (Ninja toma dano se for tocado e não estiver atacando)
        if (dist < (ninja.size/2 + en.size/2) && !ninja.attacking) {
            hp -= 0.3;
            document.getElementById('hp-fill').style.width = hp + '%';
            if (hp <= 0) gameOver("VOCÊ FOI DERROTADO!");
        }

        // Colisão Ataque (Ninja mata inimigo)
        if (ninja.attacking && dist < (isGlowUp ? 120 : 80)) {
            createExplosion(en.x, en.y, "red");
            enemies.splice(index, 1);
            score++;
            document.getElementById('score').innerText = score;
        }
    });

    // 6. PROCESSAR CHEFÃO
    if (boss.active) {
        const bdx = ninja.x - boss.x;
        const bdy = ninja.y - boss.y;
        const bDist = Math.sqrt(bdx*bdx + bdy*bdy);
        boss.x += (bdx/bDist) * 1.5;
        boss.y += (bdy/bDist) * 1.5;

        ctx.shadowBlur = 20; ctx.shadowColor = "#a020f0";
        ctx.fillStyle = "#a020f0";
        ctx.fillRect(boss.x - boss.size/2, boss.y - boss.size/2, boss.size, boss.size);

        if (ninja.attacking && bDist < (boss.size + 40)) {
            boss.hp -= 0.5;
            createExplosion(boss.x, boss.y, "#a020f0");
            if (boss.hp <= 0) gameOver("VITÓRIA! O NINJA DOURADO REINA!");
        }
    }

    // 7. PARTÍCULAS
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        if (p.life <= 0) particles.splice(i, 1);
    });

    // 8. DESENHAR NINJA
    ctx.shadowBlur = 20; ctx.shadowColor = ninja.color;
    ctx.fillStyle = ninja.color;
    ctx.fillRect(ninja.x - ninja.size/2, ninja.y - ninja.size/2, ninja.size, ninja.size);

    if (ninja.attacking) {
        ctx.beginPath();
        ctx.strokeStyle = "white";
        ctx.lineWidth = 5;
        ctx.arc(ninja.x, ninja.y, isGlowUp ? 110 : 70, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(gameLoop);
}

function gameOver(txt) {
    running = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('title').innerText = "FIM DE JOGO";
    document.getElementById('desc').innerText = txt;
}
</script>
</body>
</html>
