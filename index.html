<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X: TOTAL WAR</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui { position: absolute; top: 20px; width: 900px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .card { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; border: 2px solid #00aaff; box-shadow: 0 0 15px #00aaff; }
        .bar { width: 200px; height: 12px; background: #222; border-radius: 6px; overflow: hidden; border: 1px solid #444; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff5555); transition: 0.3s; }
        #lvl-display { color: #ffd700; font-weight: bold; text-transform: uppercase; font-size: 18px; }
        #overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
        h1 { font-size: 80px; margin: 0; color: #fff; text-shadow: 0 0 20px #00aaff; }
        .btn { padding: 15px 50px; font-size: 24px; background: #00aaff; color: #fff; border: none; cursor: pointer; border-radius: 4px; margin-top: 20px; font-weight: bold; }
        .btn:hover { background: #ffd700; color: #000; transform: scale(1.1); }
    </style>
</head>
<body>

<div id="ui">
    <div class="card">
        <div id="lvl-display">NÍVEL 1: APRENDIZ</div>
        <div class="bar"><div id="hp-fill"></div></div>
    </div>
    <div class="card" style="text-align: right; color: white;">
        KILLS: <span id="score" style="color: #ffd700; font-size: 24px;">0</span> / 30
    </div>
</div>

<div id="overlay">
    <h1 id="m-title">NINJA-X</h1>
    <p id="m-desc" style="color: #00aaff; font-size: 20px;">Elimine 30 inimigos para enfrentar o Chefe e Evoluir!</p>
    <button class="btn" onclick="start()">INICIAR COMBATE</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1000; canvas.height = 650;

let run = false, score = 0, hp = 100, maxHp = 100, level = 1, killsInLevel = 0;
let player = { x: 500, y: 325, s: 30, c: '#00aaff', spd: 5, atk: false, range: 75, glow: false };
let enemies = [], bullets = [], particles = [], keys = {};
let boss = { x: 0, y: 0, s: 120, hp: 0, maxHp: 100, active: false, c: '#a020f0' };

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

function start() {
    document.getElementById('overlay').style.display = 'none';
    run = true; score = 0; hp = 100; maxHp = 100; level = 1; killsInLevel = 0;
    enemies = []; bullets = []; player.glow = false;
    spawn(); loop();
}

function spawn() {
    if(!run || boss.active) return;
    let side = Math.random() > 0.5;
    let en = {
        x: side ? -50 : canvas.width + 50,
        y: Math.random() * canvas.height,
        s: 28,
        spd: 1.5 + (level * 0.8),
        shield: level === 3 ? 1 : 0,
        lastShot: 0
    };
    enemies.push(en);
    setTimeout(spawn, Math.max(300, 1000 - (level * 200)));
}

function drawBox(x, y, s, c, glow, shield = 0) {
    ctx.shadowBlur = glow; ctx.shadowColor = c;
    ctx.strokeStyle = c; ctx.lineWidth = 3;
    ctx.strokeRect(x - s/2, y - s/2, s, s);
    if(shield > 0) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        ctx.strokeRect(x - (s+10)/2, y - (s+10)/2, s+10, s+10);
    }
    ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(x - s/2, y - s/2, s, s);
}

function loop() {
    if(!run) return;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // Movimento
    if(keys.ArrowUp || keys.KeyW) player.y -= player.speed;
    if(keys.ArrowDown || keys.KeyS) player.y += player.speed;
    if(keys.ArrowLeft || keys.KeyA) player.x -= player.speed;
    if(keys.ArrowRight || keys.KeyD) player.x += player.speed;

    if(keys.Space && !player.atk) {
        player.atk = true;
        setTimeout(() => player.atk = false, 200);
    }

    // Lógica de Progressão (Reset de Glow Up ao subir de nível)
    if(killsInLevel >= 30 && !boss.active) {
        boss.active = true;
        boss.hp = 100 + (level * 50); boss.maxHp = boss.hp;
        boss.x = 1200; boss.y = 325;
        boss.c = level === 1 ? '#a020f0' : (level === 2 ? '#00ff00' : '#ff0000');
        player.glow = true; // Ativa Glow Up para a Boss Fight
        player.c = '#ffd700'; player.speed = 8; player.range = 140;
    }

    // Inimigos
    enemies.forEach((en, i) => {
        let dx = player.x - en.x, dy = player.y - en.y, d = Math.sqrt(dx*dx+dy*dy);
        en.x += (dx/d) * en.spd; en.y += (dy/d) * en.spd;

        // Nível 2 e 3: Atiram
        if(level >= 2 && d < 400 && Date.now() - en.lastShot > 2000) {
            bullets.push({x: en.x, y: en.y, vx: (dx/d)*5, vy: (dy/d)*5, c: 'red'});
            en.lastShot = Date.now();
        }

        drawBox(en.x, en.y, en.s, 'red', 10, en.shield);

        if(d < 30 && !player.atk) {
            hp -= 0.5;
            if(hp <= 0) end("GAME OVER - VOCÊ CAIU!");
        }

        if(player.atk && d < player.range) {
            if(en.shield > 0) { en.shield--; player.atk = false; } // Quebra escudo
            else { enemies.splice(i,1); score++; killsInLevel++; }
            document.getElementById('score').innerText = killsInLevel;
        }
    });

    // Balas
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        drawBox(b.x, b.y, 10, b.c, 10);
        let d = Math.sqrt((player.x-b.x)**2 + (player.y-b.y)**2);
        if(d < 25) { hp -= 5; bullets.splice(i,1); }
        if(b.x < 0 || b.x > 1000 || b.y < 0 || b.y > 650) bullets.splice(i,1);
    });

    // Boss Loop
    if(boss.active) {
        let bdx = player.x - boss.x, bdy = player.y - boss.y, bd = Math.sqrt(bdx*bdx+bdy*bdy);
        boss.x += (bdx/bd) * (1 + level); boss.y += (bdy/bd) * (1 + level);
        drawBox(boss.x, boss.y, boss.s, boss.c, 30, level === 3 ? 1 : 0);

        // Barra de vida do boss
        ctx.fillStyle = '#ff0000'; ctx.fillRect(boss.x-50, boss.y-80, (boss.hp/boss.maxHp)*100, 8);

        if(bd < 70) hp -= 1.5;
        if(player.atk && bd < player.range + 40) {
            boss.hp -= (0.5 + (level * 0.2));
            if(boss.hp <= 0) nextLevel();
        }
    }

    // Desenhar Ninja
    drawBox(player.x, player.y, player.s, player.c, 25);
    if(player.atk) {
        ctx.beginPath(); ctx.strokeStyle = player.c; ctx.lineWidth = 5;
        ctx.arc(player.x, player.y, player.range, 0, Math.PI*2); ctx.stroke();
    }

    document.getElementById('hp-fill').style.width = (hp/maxHp)*100 + '%';
    requestAnimationFrame(loop);
}

function nextLevel() {
    level++;
    if(level > 3) return end("VITÓRIA TOTAL! VOCÊ É O NINJA SUPREMO!");
    boss.active = false; killsInLevel = 0;
    maxHp += 50; hp = maxHp; // Upgrade de Vida
    player.glow = false; // Perde o Glow Up ao subir de nível
    player.c = '#00aaff'; player.speed = 5; player.range = 75;
    document.getElementById('lvl-display').innerText = "NÍVEL " + level + (level==2?": GUERREIRO":": LENDA");
    document.getElementById('score').innerText = "0";
    spawn();
}

function end(t) {
    run = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('m-title').innerText = "FIM";
    document.getElementById('m-desc').innerText = t;
}
</script>
</body>
</html>
