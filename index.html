<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X: TOTAL WAR (ELITE EDITION)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        
        #ui { position: absolute; top: 20px; width: 950px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        
        .hud-card { background: rgba(0, 0, 0, 0.85); padding: 15px; border-left: 5px solid #00aaff; border-radius: 4px; box-shadow: 0 0 25px rgba(0,170,255,0.3); min-width: 250px; }
        
        .bar-label { font-size: 10px; letter-spacing: 1px; color: #aaa; margin-bottom: 2px; text-transform: uppercase; }
        
        .bar-container { width: 100%; height: 12px; background: #111; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0044, #ff8800); box-shadow: 0 0 15px #ff0044; transition: 0.2s; }
        #stamina-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00aaff); box-shadow: 0 0 10px #00ff88; }
        
        #lvl-tag { color: #00aaff; font-size: 14px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
        
        #score-box { text-align: right; border-left: none; border-right: 5px solid #ffd700; }
        #score-val { color: #fff; font-size: 32px; font-weight: 900; text-shadow: 0 0 10px #ffd700; }

        #overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border: 4px solid #00aaff; }
        
        h1 { font-size: 100px; margin: 0; color: #fff; text-shadow: 0 0 20px #00aaff, 0 0 60px #00aaff; letter-spacing: 10px; }
        
        .btn { padding: 22px 90px; font-size: 24px; background: none; border: 2px solid #00aaff; color: #00aaff; cursor: pointer; transition: 0.3s; font-weight: 900; margin-top: 30px; border-radius: 4px; text-transform: uppercase; letter-spacing: 4px; }
        .btn:hover { background: #00aaff; color: #000; box-shadow: 0 0 50px #00aaff; transform: scale(1.05); }
        
        #warning { color: #ff0044; font-weight: bold; position: absolute; bottom: 50px; opacity: 0; transition: 0.3s; z-index: 20; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud-card">
        <div id="lvl-tag">FASE 1: APRENDIZ</div>
        <div class="bar-label">Vida do Ninja</div>
        <div class="bar-container"><div id="hp-fill"></div></div>
        <div class="bar-label">Vitalidade (Ataque)</div>
        <div class="bar-container"><div id="stamina-fill"></div></div>
    </div>
    <div class="hud-card" id="score-box">
        <div class="bar-label">Samurais Abatidos</div>
        <div id="score-val">0 / 30</div>
    </div>
</div>

<div id="overlay">
    <h1 id="m-title">NINJA-X</h1>
    <p id="m-desc" style="color: #00aaff; font-size: 18px; letter-spacing: 2px;">WASD/Setas: Move | Espaço: Ataca (Clique Único)</p>
    <button class="btn" onclick="init()">Entrar na Arena</button>
</div>

<div id="warning">VITALIDADE ESGOTADA!</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 1100; canvas.height = 650;

let active = false, hp = 100, maxHp = 100, level = 1, killsLvl = 0;
let stamina = 100, maxStamina = 100, canAtk = true;
let p = { x: 550, y: 325, s: 30, c: '#00aaff', spd: 6, atk: false, range: 90, glow: false };
let enemies = [], bullets = [], particles = [], lasers = [], keys = {}, lastKeys = {};
let boss = { x: 1300, y: 325, s: 150, hp: 0, max: 100, active: false, c: '#a020f0', lastAction: 0 };

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => { keys[e.code] = false; delete lastKeys[e.code]; };

function init() {
    document.getElementById('overlay').style.display = 'none';
    active = true; hp = 100; maxHp = 100; level = 1; killsLvl = 0; stamina = 100;
    enemies = []; bullets = []; lasers = []; p.glow = false; p.spd = 6; p.c = '#00aaff'; p.s = 30; p.range = 90;
    spawn(); loop();
}

function spawn() {
    if(!active || boss.active) return;
    let side = Math.random() > 0.5;
    enemies.push({ 
        x: side ? -70 : canvas.width + 70, 
        y: Math.random() * canvas.height, 
        s: 32, 
        spd: 2.5 + (level * 1.5), 
        shield: level === 3 ? 1 : 0,
        lastShot: Date.now()
    });
    setTimeout(spawn, Math.max(200, 800 - (level * 200)));
}

function drawEntity(x, y, s, color, glow, shield = 0) {
    ctx.shadowBlur = glow; ctx.shadowColor = color;
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.strokeRect(x - s/2, y - s/2, s, s);
    if(shield > 0) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
        ctx.strokeRect(x - (s+14)/2, y - (s+14)/2, s+14, s+14);
    }
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(x - s/2, y - s/2, s, s);
}

function loop() {
    if(!active) return;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Movimentação + Trava de Tela
    let mx = 0, my = 0;
    if(keys.ArrowUp || keys.KeyW) my = -1;
    if(keys.ArrowDown || keys.KeyS) my = 1;
    if(keys.ArrowLeft || keys.KeyA) mx = -1;
    if(keys.ArrowRight || keys.KeyD) mx = 1;
    
    p.x += mx * p.spd; p.y += my * p.spd;
    if (p.x < p.s/2) p.x = p.s/2;
    if (p.x > canvas.width - p.s/2) p.x = canvas.width - p.s/2;
    if (p.y < p.s/2) p.y = p.s/2;
    if (p.y > canvas.height - p.s/2) p.y = canvas.height - p.s/2;

    // Vitalidade (Stamina)
    if (stamina < maxStamina) stamina += 0.5; 
    if (stamina <= 0) { canAtk = false; document.getElementById('warning').style.opacity = 1; }
    if (stamina >= 20) { canAtk = true; document.getElementById('warning').style.opacity = 0; }

    // Ataque (Single Press Logic)
    if(keys.Space && !lastKeys['Space'] && canAtk && !p.atk) {
        p.atk = true;
        stamina -= 20;
        lastKeys['Space'] = true; 
        setTimeout(() => p.atk = false, 150);
    }

    if(killsLvl >= 30 && !boss.active) {
        boss.active = true;
        boss.hp = 200 * level; boss.max = boss.hp;
        boss.x = 1300; boss.y = 325;
        boss.c = level === 1 ? '#ff00ff' : (level === 2 ? '#00ff00' : '#ffffff');
        p.glow = true; p.c = '#ffd700'; p.spd = 12; p.range = 190; p.s = 55;
    }

    enemies.forEach((en, i) => {
        let dx = p.x - en.x, dy = p.y - en.y, d = Math.sqrt(dx*dx+dy*dy);
        en.x += (dx/d) * en.spd; en.y += (dy/d) * en.spd;

        if(level >= 2 && d < 500 && Date.now() - en.lastShot > 1600) {
            bullets.push({x: en.x, y: en.y, vx: (dx/d)*8, vy: (dy/d)*8, c: '#ff3300'});
            en.lastShot = Date.now();
        }

        drawEntity(en.x, en.y, en.s, '#ff0000', 15, en.shield);
        if(d < 35 && !p.atk) hp -= 1.5;
        if(p.atk && d < p.range) {
            if(en.shield > 0) { en.shield = 0; p.atk = false; } 
            else { enemies.splice(i, 1); killsLvl++; }
            document.getElementById('score-val').innerText = killsLvl + " / 30";
        }
    });

    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        drawEntity(b.x, b.y, 14, b.c, 10);
        if(Math.sqrt((p.x-b.x)**2 + (p.y-b.y)**2) < 30) { hp -= 15; bullets.splice(i, 1); }
    });

    if(boss.active) {
        let bdx = p.x - boss.x, bdy = p.y - boss.y, bd = Math.sqrt(bdx*bdx+bdy*bdy);
        boss.x += (bdx/bd) * (3 + level); boss.y += (bdy/bd) * (3 + level);
        drawEntity(boss.x, boss.y, boss.s, boss.c, 60, level === 3 ? 2 : 0);

        // Barra do Boss
        ctx.fillStyle = boss.c; ctx.fillRect(boss.x-75, boss.y-110, (boss.hp/boss.max)*150, 10);

        // BOSS POWERS
        let now = Date.now();
        if (now - boss.lastAction > 2000) {
            lasers.push({x: boss.x, y: boss.y, tx: p.x, ty: p.y, l: 35}); // LASER
            if (level >= 2) { // SUMMON
                for(let k=0; k<3; k++) enemies.push({x: boss.x, y: boss.y, s: 32, spd: 4, shield: 0, lastShot: now});
            }
            boss.lastAction = now;
        }

        if(bd < 100) hp -= 2.5;
        if(p.atk && bd < p.range + 70) boss.hp -= (0.8 + (level * 0.7));
        if(boss.hp <= 0) advance();
    }

    lasers.forEach((ls, i) => {
        ctx.beginPath(); ctx.strokeStyle = boss.c; ctx.lineWidth = ls.l/3;
        ctx.moveTo(ls.x, ls.y); ctx.lineTo(ls.tx, ls.ty); ctx.stroke();
        ls.l--;
        if(ls.l <= 0) lasers.splice(i, 1);
    });

    drawEntity(p.x, p.y, p.s, p.c, 30);
    if(p.atk) {
        ctx.beginPath(); ctx.strokeStyle = p.c; ctx.lineWidth = 7;
        ctx.arc(p.x, p.y, p.range, 0, Math.PI*2); ctx.stroke();
    }

    document.getElementById('hp-fill').style.width = Math.max(0, (hp/maxHp)*100) + '%';
    document.getElementById('stamina-fill').style.width = (stamina/maxStamina)*100 + '%';
    if(hp <= 0) gameOver("DERROTADO");
    requestAnimationFrame(loop);
}

function advance() {
    level++;
    if(level > 3) return gameOver("VITÓRIA LENDÁRIA!");
    boss.active = false; killsLvl = 0; maxHp += 100; hp = maxHp; stamina = maxStamina;
    p.glow = false; p.c = '#00aaff'; p.spd = 6 + level; p.s = 30; p.range = 90;
    document.getElementById('lvl-tag').innerText = "FASE " + level;
    document.getElementById('score-val').innerText = "0 / 30";
}

function gameOver(t) {
    active = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('m-title').innerText = t;
}
</script>
</body>
</html>
