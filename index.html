<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X: LEGACY</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui { position: absolute; top: 20px; width: 950px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .card { background: rgba(0, 0, 0, 0.85); padding: 12px 25px; border-left: 5px solid #00aaff; border-radius: 4px; box-shadow: 0 0 15px rgba(0,170,255,0.3); }
        .hp-bar { width: 200px; height: 10px; background: #111; border: 1px solid #444; margin-top: 8px; position: relative; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0044, #ff8800); box-shadow: 0 0 10px #ff0044; transition: 0.2s; }
        #lvl-text { color: #ffd700; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        #overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border: 2px solid #00aaff; }
        h1 { font-size: 100px; margin: 0; color: #fff; text-shadow: 0 0 20px #00aaff, 0 0 40px #00aaff; letter-spacing: 10px; }
        .btn { padding: 20px 80px; font-size: 28px; background: none; border: 2px solid #00aaff; color: #00aaff; cursor: pointer; transition: 0.3s; font-weight: bold; margin-top: 40px; }
        .btn:hover { background: #00aaff; color: #000; box-shadow: 0 0 40px #00aaff; transform: scale(1.05); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="ui">
    <div class="card">
        <div id="lvl-text">Status: Iniciando...</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
    </div>
    <div class="card" style="text-align: right; border-left: none; border-right: 5px solid #ffd700;">
        <div style="color: #aaa; font-size: 12px;">SCORE TOTAL</div>
        <div id="score" style="color: #fff; font-size: 28px; font-weight: 900;">0</div>
    </div>
</div>

<div id="overlay">
    <h1 id="m-title">NINJA-X</h1>
    <p id="m-desc" style="color: #00aaff; font-size: 18px;">EVOLUA PARA SOBREVIVER</p>
    <button class="btn" onclick="init()">ENTRAR NA ARENA</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1100; canvas.height = 650;

let active = false, score = 0, hp = 100, level = 1, enemies = [], particles = [], keys = {};
let p = { x: 550, y: 325, s: 30, c: '#00aaff', spd: 5, atk: false, range: 75 };
let boss = { x: 1300, y: 325, s: 130, hp: 300, max: 300, active: false };

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

function init() {
    document.getElementById('overlay').style.display = 'none';
    active = true; score = 0; hp = 100; level = 1; enemies = []; boss.active = false;
    spawn();
    loop();
}

function spawn() {
    if(!active || boss.active) return;
    let side = Math.random() > 0.5;
    enemies.push({ 
        x: side ? -50 : canvas.width + 50, 
        y: Math.random() * canvas.height, 
        s: 28, 
        spd: 1.5 + (level * 1.2) // Dificuldade aumenta por nível
    });
    // Spawn acelera conforme nível
    let rate = level == 1 ? 1000 : (level == 2 ? 600 : 400);
    setTimeout(spawn, rate);
}

function drawEntity(x, y, s, color, glow) {
    ctx.shadowBlur = glow;
    ctx.shadowColor = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x - s/2, y - s/2, s, s);
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(x - s/2, y - s/2, s, s);
    // Núcleo
    ctx.fillStyle = color;
    ctx.fillRect(x - 4, y - 4, 8, 8);
}

function loop() {
    if(!active) return;
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; // Rastro de movimento
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Movimento Suave (Setas + WASD)
    let mx = 0, my = 0;
    if(keys.ArrowUp || keys.KeyW) my = -1;
    if(keys.ArrowDown || keys.KeyS) my = 1;
    if(keys.ArrowLeft || keys.KeyA) mx = -1;
    if(keys.ArrowRight || keys.KeyD) mx = 1;
    p.x += mx * p.spd; p.y += my * p.spd;

    // Sistema de Ataque
    if(keys.Space && !p.atk) {
        p.atk = true;
        setTimeout(() => p.atk = false, 150);
    }

    // LÓGICA DE NÍVEIS E GLOW UP
    if(score >= 15 && level == 1) {
        level = 2; hp = 100; p.c = '#ff00ff'; p.spd = 7; p.range = 100;
        document.getElementById('lvl-text').innerText = "Nível 2: Mestre das Sombras";
    }
    if(score >= 35 && level == 2) {
        level = 3; hp = 100; p.c = '#ffd700'; p.spd = 10; p.range = 150; p.s = 50;
        boss.active = true;
        document.getElementById('lvl-text').innerText = "Nível 3: DEUS NINJA (GLOW UP)";
    }

    // Inimigos
    enemies.forEach((en, i) => {
        let dx = p.x - en.x, dy = p.y - en.y, dist = Math.sqrt(dx*dx+dy*dy);
        en.x += (dx/dist) * en.spd; en.y += (dy/dist) * en.spd;

        drawEntity(en.x, en.y, en.s, '#ff3333', 10);

        // Dano
        if(dist < 30 && !p.atk) {
            hp -= level == 3 ? 0.8 : 0.4;
            document.getElementById('hp-fill').style.width = hp + '%';
            if(hp <= 0) die("VOCÊ FOI ELIMINADO!");
        }

        // Morte Inimigo
        if(p.atk && dist < p.range) {
            enemies.splice(i, 1);
            score++;
            document.getElementById('score').innerText = score;
            for(let j=0; j<5; j++) particles.push({x:en.x, y:en.y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, l:15, c:'#ff3333'});
        }
    });

    // Boss Battle
    if(boss.active) {
        let bdx = p.x - boss.x, bdy = p.y - boss.y, bd = Math.sqrt(bdx*bdx+bdy*bdy);
        boss.x += (bdx/bd) * 2.5; boss.y += (bdy/bd) * 2.5;
        drawEntity(boss.x, boss.y, boss.s, '#a020f0', 30);
        
        // Vida do Boss (barra flutuante)
        ctx.fillStyle = '#222'; ctx.fillRect(boss.x-50, boss.y-80, 100, 5);
        ctx.fillStyle = '#a020f0'; ctx.fillRect(boss.x-50, boss.y-80, (boss.hp/boss.max)*100, 5);

        if(bd < 80) { hp -= 1.5; document.getElementById('hp-fill').style.width = hp + '%'; }
        if(p.atk && bd < p.range + 50) {
            boss.hp -= 2;
            if(boss.hp <= 0) die("VITÓRIA SUPREMA! VOCÊ É O NINJA-X!");
        }
    }

    // Desenhar Ninja
    drawEntity(p.x, p.y, p.s, p.c, 25);
    if(p.atk) {
        ctx.beginPath(); ctx.strokeStyle = p.c; ctx.lineWidth = 5;
        ctx.arc(p.x, p.y, p.range, 0, Math.PI*2); ctx.stroke();
    }

    // Partículas
    particles.forEach((pt, i) => {
        pt.x += pt.vx; pt.y += pt.vy; pt.l--;
        ctx.fillStyle = pt.c; ctx.fillRect(pt.x, pt.y, 2, 2);
        if(pt.l <= 0) particles.splice(i, 1);
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(loop);
}

function die(t) {
    active = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('m-title').innerText = "FIM";
    document.getElementById('m-desc').innerText = t;
}
</script>
</body>
</html>
