<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X: THE LAST STAND</title>
    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: radial-gradient(circle, #111 0%, #000 100%); border: 3px solid #00aaff; box-shadow: 0 0 30px #00aaff; cursor: crosshair; }
        #ui-container { position: absolute; top: 20px; width: 800px; display: flex; justify-content: space-between; pointer-events: none; }
        .stat { color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000; }
        #hp-bar-back { width: 200px; height: 20px; background: #333; border: 2px solid #fff; margin-top: 5px; }
        #hp-bar-fill { width: 100%; height: 100%; background: #ff3333; transition: 0.2s; }
        #menu { position: absolute; background: rgba(0,0,0,0.9); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border: 4px solid #00aaff; }
        h1 { color: #00aaff; font-size: 80px; margin: 0; text-shadow: 0 0 20px #00aaff; }
        button { padding: 15px 50px; font-size: 25px; background: #00aaff; color: white; border: none; cursor: pointer; border-radius: 5px; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #ffd700; color: black; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="menu">
        <h1>NINJA-X</h1>
        <p style="color: #aaa; font-size: 18px;">WASD - Mover | ESPAÇO - Atacar</p>
        <button onclick="iniciar()">INICIAR BATALHA</button>
    </div>

    <div id="ui-container">
        <div>
            <div class="stat">ENERGIA NINJA</div>
            <div id="hp-bar-back"><div id="hp-bar-fill"></div></div>
        </div>
        <div class="stat">KILLS: <span id="score">0</span> / 30</div>
    </div>

    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 600;

let gameActive = false;
let score = 0;
let glowUp = false;
let ninjaHP = 100;
let bossActive = false;

const player = { x: 400, y: 300, size: 30, speed: 5, color: '#00aaff', attacking: false };
const enemies = [];
const particles = [];
const boss = { x: 900, y: 300, size: 100, hp: 100, active: false };
let keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function iniciar() {
    document.getElementById('menu').style.display = 'none';
    gameActive = true;
    spawnEnemy();
    loop();
}

function spawnEnemy() {
    if (!gameActive || bossActive) return;
    const x = Math.random() > 0.5 ? -50 : 850;
    const y = Math.random() * 600;
    enemies.push({ x, y, size: 25, speed: glowUp ? 1.5 : 2 });
    setTimeout(spawnEnemy, glowUp ? 400 : 800);
}

function createEffect(x, y, color) {
    for(let i=0; i<8; i++) {
        particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 15, color});
    }
}

function loop() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Movimentação
    if (keys['KeyW']) player.y -= player.speed;
    if (keys['KeyS']) player.y += player.speed;
    if (keys['KeyA']) player.x -= player.speed;
    if (keys['KeyD']) player.x += player.speed;

    // Ataque
    if (keys['Space'] && !player.attacking) {
        player.attacking = true;
        setTimeout(() => player.attacking = false, 200);
    }

    // Glow Up (30 Kills)
    if (score >= 30 && !glowUp) {
        glowUp = true;
        player.color = '#ffd700';
        player.speed = 9;
        player.size = 45;
        bossActive = true;
    }

    // Inimigos
    enemies.forEach((en, i) => {
        const dx = player.x - en.x;
        const dy = player.y - en.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        en.x += (dx/dist) * en.speed;
        en.y += (dy/dist) * en.speed;

        // Ninja Toma Dano (Se não estiver atacando)
        if (dist < 30 && !player.attacking) {
            ninjaHP -= 0.5;
            document.getElementById('hp-bar-fill').style.width = ninjaHP + "%";
            if (ninjaHP <= 0) {
                alert("NINJA DERROTADO! TENTE NOVAMENTE.");
                location.reload();
            }
        }

        // Ninja Mata Inimigo
        if (player.attacking && dist < (glowUp ? 100 : 70)) {
            createEffect(en.x, en.y, 'red');
            enemies.splice(i, 1);
            score++;
            document.getElementById('score').innerText = score;
        }
    });

    // Boss Final
    if (bossActive) {
        const bdx = player.x - boss.x;
        const bdy = player.y - boss.y;
        const bDist = Math.sqrt(bdx*bdx + bdy*bdy);
        boss.x += (bdx/bDist) * 1.5; boss.y += (bdy/bDist) * 1.5;
        
        ctx.fillStyle = '#a020f0';
        ctx.shadowBlur = 20; ctx.shadowColor = '#a020f0';
        ctx.fillRect(boss.x-50, boss.y-50, 100, 100);

        if (player.attacking && bDist < 120) {
            boss.hp -= 0.5;
            createEffect(boss.x, boss.y, '#a020f0');
            if (boss.hp <= 0) { alert("MESTRE SAMURAI DERROTADO! NOTA 10!"); location.reload(); }
        }
    }

    // Partículas
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        if (p.life <= 0) particles.splice(i, 1);
    });

    // Desenhar Ninja
    ctx.shadowBlur = 20; ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
    
    if (player.attacking) {
        ctx.strokeStyle = "white"; ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(player.x, player.y, glowUp ? 100 : 60, 0, Math.PI*2);
        ctx.stroke();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
