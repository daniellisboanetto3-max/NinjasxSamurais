<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X ALPHA</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #050505; border: 3px solid #333; box-shadow: 0 0 20px #00aaff; }
        #hud { position: absolute; top: 20px; color: white; font-size: 24px; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="hud">DERROTADOS: <span id="score">0</span> / 30</div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score');

// Configurações da Tela
canvas.width = 800;
canvas.height = 600;

// Variáveis de Jogo
let score = 0;
let glowUp = false;
let bossMode = false;
let gameActive = true;

// Definição do Jogador
const ninja = {
    x: 400, y: 300, size: 30, color: '#00aaff', speed: 5,
    attacking: false, range: 70
};

// Definição do Chefão
const boss = { x: 900, y: 300, size: 100, hp: 100, color: '#a020f0' };

let enemies = [];
let keys = {};

// Controles
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Função para criar samurais
function spawnSamurai() {
    if (bossMode || !gameActive) return;
    const x = Math.random() > 0.5 ? -40 : 840;
    const y = Math.random() * canvas.height;
    enemies.push({ x, y, size: 25, speed: 1.5 + (score * 0.05) });
    setTimeout(spawnSamurai, glowUp ? 400 : 900);
}

// Lógica Principal
function update() {
    if (!gameActive) return;

    // Movimentação do Ninja
    if (keys['ArrowUp'] || keys['KeyW']) ninja.y -= ninja.speed;
    if (keys['ArrowDown'] || keys['KeyS']) ninja.y += ninja.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) ninja.x -= ninja.speed;
    if (keys['ArrowRight'] || keys['KeyD']) ninja.x += ninja.speed;

    // Ataque
    if (keys['Space']) {
        ninja.attacking = true;
        setTimeout(() => ninja.attacking = false, 150);
    }

    // Checar Glow Up (Nível 30)
    if (score >= 30 && !glowUp) {
        glowUp = true;
        ninja.color = '#ffd700'; // Dourado
        ninja.size = 50;
        ninja.speed = 8;
        ninja.range = 130;
        bossMode = true;
    }

    // Lógica dos Samurais
    enemies.forEach((enemy, index) => {
        // Seguir o Ninja
        const dx = ninja.x - enemy.x;
        const dy = ninja.y - enemy.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        enemy.x += (dx/dist) * enemy.speed;
        enemy.y += (dy/dist) * enemy.speed;

        // Dano: Se o ninja atacar perto do samurai
        if (ninja.attacking && dist < ninja.range) {
            enemies.splice(index, 1);
            score++;
            scoreDisplay.innerText = score;
        }

        // Se o samurai tocar o ninja e ele não estiver atacando (Game Over simples)
        if (!ninja.attacking && dist < 25) {
            // Aqui você poderia colocar perda de vida, mas vamos manter simples para rodar
        }
    });

    // Lógica do Chefão
    if (bossMode) {
        const dx = ninja.x - boss.x;
        const dy = ninja.y - boss.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        boss.x += (dx/dist) * 1.2;
        boss.y += (dy/dist) * 1.2;

        if (ninja.attacking && dist < ninja.range + 40) {
            boss.hp -= 0.5;
            if (boss.hp <= 0) {
                alert("VITÓRIA! VOCÊ DERROTOU O SAMURAI SUPREMO!");
                location.reload();
            }
        }
    }

    draw();
    requestAnimationFrame(update);
}

// Desenhar na Tela
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenhar Samurais
    ctx.fillStyle = 'red';
    enemies.forEach(en => {
        ctx.fillRect(en.x - en.size/2, en.y - en.size/2, en.size, en.size);
    });

    // Desenhar Chefão
    if (bossMode) {
        ctx.fillStyle = boss.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = boss.color;
        ctx.fillRect(boss.x - boss.size/2, boss.y - boss.size/2, boss.size, boss.size);
        // Barra de vida do Boss
        ctx.fillStyle = 'white';
        ctx.fillRect(boss.x - 50, boss.y - 70, 100, 10);
        ctx.fillStyle = 'red';
        ctx.fillRect(boss.x - 50, boss.y - 70, boss.hp, 10);
    }

    // Desenhar Efeito de Ataque
    if (ninja.attacking) {
        ctx.beginPath();
        ctx.strokeStyle = ninja.color;
        ctx.lineWidth = 5;
        ctx.arc(ninja.x, ninja.y, ninja.range, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Desenhar Ninja
    ctx.fillStyle = ninja.color;
    ctx.shadowBlur = glowUp ? 25 : 10;
    ctx.shadowColor = ninja.color;
    ctx.fillRect(ninja.x - ninja.size/2, ninja.y - ninja.size/2, ninja.size, ninja.size);
    ctx.shadowBlur = 0; // Reset sombra para não pesar
}

// Iniciar Processos
spawnSamurai();
update();

</script>
</body>
</html>
