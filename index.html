<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NINJA-X</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid #00aaff; background: #111; }
        #ui { position: absolute; top: 10px; font-size: 20px; font-weight: bold; color: #00aaff; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="ui">KILLS: <span id="score">0</span> / 30</div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
canvas.width = 800; canvas.height = 600;

let score = 0;
let glowUp = false;
let bossActive = false;

const player = { x: 400, y: 300, size: 30, color: '#00aaff', speed: 5, isAttacking: false };
const boss = { x: 900, y: 250, size: 80, hp: 100, active: false };
let enemies = [];
let keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function spawnEnemy() {
    if (bossActive) return;
    enemies.push({ x: Math.random() > 0.5 ? -30 : 830, y: Math.random() * 600, size: 25, speed: 2 });
    setTimeout(spawnEnemy, glowUp ? 400 : 800);
}

function update() {
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

    if (keys['Space']) {
        player.isAttacking = true;
        setTimeout(() => player.isAttacking = false, 150);
    }

    if (score >= 30 && !glowUp) {
        glowUp = true;
        player.color = '#ffd700';
        player.size = 50;
        player.speed = 8;
        bossActive = true;
    }

    enemies.forEach((en, i) => {
        let dx = player.x - en.x;
        let dy = player.y - en.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        en.x += (dx/dist) * en.speed;
        en.y += (dy/dist) * en.speed;

        if (player.isAttacking && dist < 70) {
            enemies.splice(i, 1);
            score++;
            scoreEl.innerText = score;
        }
    });

    if (bossActive) {
        let dx = player.x - boss.x;
        let dy = player.y - boss.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        boss.x += (dx/dist) * 1.5;
        boss.y += (dy/dist) * 1.5;
        if (player.isAttacking && dist < 100) {
            boss.hp -= 1;
            if (boss.hp <= 0) { alert("VENCEU O CHEFÃO!"); location.reload(); }
        }
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);

    if (player.isAttacking) {
        ctx.strokeStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, glowUp ? 100 : 60, 0, Math.PI*2);
        ctx.stroke();
    }

    ctx.fillStyle = 'red';
    enemies.forEach(en => ctx.fillRect(en.x - 12, en.y - 12, 25, 25));

    if (bossActive) {
        ctx.fillStyle = 'purple';
        ctx.fillRect(boss.x - 40, boss.y - 40, 80, 80);
    }
}

spawnEnemy();
update();
</script>
</body>
</html>
